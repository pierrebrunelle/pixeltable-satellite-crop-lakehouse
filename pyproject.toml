[project]
name = "pixeltable-satellite-crop-lakehouse"
version = "0.1.0"
description = "Multimodal data pipeline that scores satellite crop tiles with computed columns and exports to Parquet, Iceberg and LanceDB - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "satellite-crop-lakehouse"]
dependencies = [
    "pixeltable>=0.7.24",
    "pillow",
    "lancedb",
    "pyiceberg",
    "pylance",
    "sqlalchemy",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
